openapi: "3.0.0"
info:
  version: 1.0.0
  title: RequeueIP CNI
  description: Wrapper for CNI requests and responses.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://unix:/var/run/requeueip.sock
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: RequeueIP daemon is healthy.
  /ips:
    post:
      operationId: cmdAdd
      parameters:
        - name: args
          in: body
          required: true
          schema:
            $ref: '#/components/schemas/AddArgs'
      responses:
        '200':
          description: Successfully assigned IP addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        default:
          description: Failed to assgin IP addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: cmdDel
      parameters:
        - name: args
          in: body
          required: true
          schema:
            $ref: '#/components/schemas/DelArgs'
      responses:
        '200':
          description: Successfully released IP addresses.
        default:
          description: Failed to release IP addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: string
    AddArgs:
      type: object
      properties:
        containerID:
          type: string
        ifName:
          type: string
        podNamespace:
          type: string
        podName:
          type: string
      required:
      - containerID
      - ifName
      - podNamespace
      - podName
    Result:
      type: object
      properties:
        ips:
          type: array
          items:
            $ref: "#/components/schemas/IPConfig"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        dns:
          type: object
          $ref: "#/components/schemas/DNS"
      required:
      - ips
    IPConfig:
      type: object
      properties:
        address:
          type: string
        gateway:
          type: string
      required:
      - address
    Route:
      type: object
      properties:
        dst:
          type: string
        gw:
          type: string
      required:
      - dst
    DNS:
      type: object
      properties:
        nameservers:
          type: array
          items:
            type: string
        domain:
          type: string
        search:
          type: array
          items:
            type: string
        options:
          type: array
          items:
            type: string
      required:
      - nameservers
    DelArgs:
      type: object
      properties:
        containerID:
          type: string
        ifName:
          type: string
        podNamespace:
          type: string
        podName:
          type: string
      required:
      - containerID
      - ifName
      - podNamespace
      - podName