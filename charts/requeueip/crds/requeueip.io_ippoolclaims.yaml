---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: ippoolclaims.requeueip.io
spec:
  group: requeueip.io
  names:
    categories:
    - requeueip
    kind: IPPoolClaim
    listKind: IPPoolClaimList
    plural: ippoolclaims
    shortNames:
    - rpc
    singular: ippoolclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The IP version of the IPPool to be synced.
      jsonPath: .spec.version
      name: VERSION
      type: string
    - description: The total number of IP addresses of the IPPool to be synced.
      jsonPath: .spec.replicas
      name: REPLICAS
      type: integer
    - description: The Subnet selected from the candidate Subnets.
      jsonPath: .status.subnet
      name: SUBNET
      type: string
    - description: The current size of the IPPool created based on the claim.
      jsonPath: .status.poolSize
      name: POOL-SIZE
      type: integer
    - description: The delay for IPPool scaling down.
      jsonPath: .spec.scaleDownDelay
      name: SCALE-DOWN-DELAY
      type: string
    - description: The age of IPPoolClaim.
      jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: IPPoolClaim is the Schema for the IPPoolClaims API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IPPoolClaimSpec defines the desired state of IPPoolClaim.
            properties:
              replicas:
                description: |-
                  The total number of IP addresses of the IPPool to be synced. It should
                  always be consistent with the replica of the owner workload.
                format: int32
                minimum: 0
                type: integer
              scaleDownDelay:
                default: "0"
                description: |-
                  The delay for IPPool scaling down. Support format like "1w2d6h3s" (1 week
                  2 days 6 hours and 3 seconds). Default to "0" means disabled.
                pattern: ^(?:(\d+w|\d+d|\d+h|\d+m|\d+s)+|0)$
                type: string
              subnets:
                description: List of candidate Subnet names for IP address assignments.
                items:
                  type: string
                minItems: 1
                type: array
              version:
                description: The IP version of the IPPool to be synced.
                enum:
                - IPv4
                - IPv6
                type: string
            required:
            - replicas
            - subnets
            - version
            type: object
          status:
            description: IPPoolClaimStatus defines the observed state of IPPoolClaim.
            properties:
              nextScaleDownTime:
                description: |-
                  The next available time for scaling down. Nil indicates that ScaleDownDelay
                  is disabled or there is not much waste in the IPPool.
                format: date-time
                type: string
              poolSize:
                description: The current size of the IPPool created based on the claim.
                format: int32
                type: integer
              subnet:
                description: The Subnet selected from the candidate Subnets.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
