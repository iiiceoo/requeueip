apiVersion: v1
kind: Service
metadata:
  name: {{ include "requeueip.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "requeueip.controller.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webhookService.type }}
  selector:
    {{- include "requeueip.controller.selectorLabels" . | nindent 4 }}
  ports:
  - name: webhook
    port: {{ .Values.webhookService.port }}
    targetPort: webhook
    protocol: TCP