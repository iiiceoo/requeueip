apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "requeueip.fullname" . }}-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "requeueip.fullname" . }}-admin
subjects:
- kind: ServiceAccount
  name: {{ include "requeueip.daemon" . }}
  namespace: {{ .Release.Namespace }}
- kind: ServiceAccount
  name: {{ include "requeueip.controller" . }}
  namespace: {{ .Release.Namespace }}